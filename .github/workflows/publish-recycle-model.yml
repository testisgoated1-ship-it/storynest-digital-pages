name: Publish recycle model for website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "website-publish-trigger.txt"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install model conversion dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision onnx

      - name: Download known-good trained model
        uses: actions/download-artifact@v4
        with:
          name: waste-recycling-model
          path: recycle-model-training/output
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35672738858

      - name: Verify trained model artifact
        run: |
          set -euo pipefail
          test -s recycle-model-training/output/waste_recycling_resnet18.pt
          echo "Using existing trained model artifact. No training step is present."

      - name: Export and validate ONNX model
        run: python recycle-model-training/export_onnx.py

      - name: Publish model
        run: |
          set -euo pipefail
          mkdir -p public
          test -s recycle-model-training/output/recycle_model.onnx
          test -s recycle-model-training/output/class_map.json
          cp recycle-model-training/output/recycle_model.onnx public/recycle-model.onnx
          cp recycle-model-training/output/class_map.json public/recycle-class-map.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/recycle-model.onnx public/recycle-class-map.json
          git diff --cached --quiet || git commit -m "Publish recycle classifier model [skip ci]"
          git push
