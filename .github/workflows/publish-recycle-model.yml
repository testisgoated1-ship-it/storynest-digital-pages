name: Publish recycle model for website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "website-publish-trigger.txt"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install model conversion dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision onnx

      - name: Download known-good trained model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p recycle-model-training/output
          ARTIFACT_ID=10673887320
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" \
            -o /tmp/model.zip
          unzip -t /tmp/model.zip
          unzip -o /tmp/model.zip -d recycle-model-training/output
          test -s recycle-model-training/output/waste_recycling_resnet18.pt

      - name: Export and validate ONNX model
        run: python recycle-model-training/export_onnx.py

      - name: Publish model
        run: |
          set -euo pipefail
          mkdir -p public
          test -s recycle-model-training/output/recycle_model.onnx
          test -s recycle-model-training/output/class_map.json
          cp recycle-model-training/output/recycle_model.onnx public/recycle-model.onnx
          cp recycle-model-training/output/class_map.json public/recycle-class-map.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/recycle-model.onnx public/recycle-class-map.json
          git diff --cached --quiet || git commit -m "Publish recycle classifier model [skip ci]"
          git push
